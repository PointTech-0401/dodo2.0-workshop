<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=Noto+Serif+TC:wght@500;700;900&amp;display=swap">
  <style>
    body { margin: 0; background: #f7f2e8; }
    a { color: #287653; } a:hover { color: #15324a; }
  </style>
</helmet>
<div style="position: relative; width: 1600px; height: 900px; overflow: hidden; background: #fffdf8; font-family: 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; color: #15324a;">
  <div style="position: absolute; left: 0; top: 0; width: 12px; height: 900px; background: #287653;"></div>
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 30px; padding: 58px 88px 52px 108px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 32px; padding-bottom: 18px; border-bottom: 1px solid #cfd9dc;">
      <span style="color: #287653; font: 800 16px/1 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; letter-spacing: .18em;">WORKSHOP 02 · 會記得、會主動，也知道何時閉嘴</span>
      <span style="color: #4d6475; font: 700 15px/1 Consolas,'Noto Sans TC',monospace; letter-spacing: .14em;">04 / 22</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 13px;">
      <h1 style="margin: 0; max-width: 1310px; color: #15324a; font: 700 52px/1.16 'Noto Serif TC',Georgia,serif; letter-spacing: -.025em; text-wrap: pretty;">開場設定</h1>
      
    </div>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 22px; min-height: 0;">
      <ol style="display: flex; flex-direction: column; gap: 16px; margin: 0; padding: 0; list-style: none;"><li style="display: flex; gap: 18px; align-items: center;">
      <div style="flex-shrink: 0; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: #d9edf7; color: #287653; font: 800 18px/1 Consolas,'Noto Sans TC',monospace;">1</div>
      <span style="color: #15324a; font: 22px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">按最上方的「02 記憶與主動」。</span>
    </li>
<li style="display: flex; gap: 18px; align-items: center;">
      <div style="flex-shrink: 0; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: #d9edf7; color: #287653; font: 800 18px/1 Consolas,'Noto Sans TC',monospace;">2</div>
      <span style="color: #15324a; font: 22px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">回到「01 Realtime Agent」，把「使用者名字／稱呼」改成「秀蘭阿嬤」，按「套用」。</span>
    </li>
<li style="display: flex; gap: 18px; align-items: center;">
      <div style="flex-shrink: 0; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: #d9edf7; color: #287653; font: 800 18px/1 Consolas,'Noto Sans TC',monospace;">3</div>
      <span style="color: #15324a; font: 22px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">「主動對話」分頁：類型選「閒聊」，內容填「跟她說午安，問她今天想聽什麼歌」，提醒時間選剛過去的一分鐘，按「加入待提醒」。</span>
    </li>
<li style="display: flex; gap: 18px; align-items: center;">
      <div style="flex-shrink: 0; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: #d9edf7; color: #287653; font: 800 18px/1 Consolas,'Noto Sans TC',monospace;">4</div>
      <span style="color: #15324a; font: 22px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">只參加第二堂：在「對話規範」分頁打開「完整 System Prompt」，查看第一堂的設定。</span>
    </li></ol>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding-top: 16px; border-top: 1px solid #cfd9dc;">
      <span style="flex-shrink: 0; width: 9px; height: 9px; border-radius: 50%; background: #f1b879;"></span>
      <span style="color: #4d6475; font: 19px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">沒有修改稱呼的話，Prompt 裡會同時出現「王奶奶」與「秀蘭阿嬤」。</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
