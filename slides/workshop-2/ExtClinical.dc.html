    body { margin: 0; background: #f7f2e8; }

<div style="position: relative; width: 1600px; height: 900px; overflow: hidden; background: #fffdf8; font-family: 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; color: #15324a;">

      <span style="color: #287653; font: 800 18px/1 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; letter-spacing: .18em;">WORKSHOP 02 · 會記得、會主動，也知道何時該安靜</span>
      <span style="color: #4d6475; font: 700 17px/1 Consolas,'Noto Sans TC',monospace; letter-spacing: .14em;">18 / 25</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 13px;">
      <h1 style="margin: 0; max-width: 1310px; color: #15324a; font: 700 54px/1.16 'Noto Serif TC',Georgia,serif; letter-spacing: -.025em; text-wrap: pretty;">小實作：換成照護嚴謹型</h1>
      <p style="margin: 0; max-width: 1200px; color: #4d6475; font: 25px/1.62 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">用「對話規範」的「同一句話，前後對照」。建檔一個字都不動。</p>
    </div>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: flex-start; gap: 22px; min-height: 0;">
      <div style="display: flex; gap: 32px; align-items: stretch;"><ol style="display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none;"><li style="display: flex; gap: 18px; align-items: center;">
      <div style="flex-shrink: 0; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: #d9edf7; color: #287653; font: 800 20px/1 Consolas,'Noto Sans TC',monospace;">1</div>
      <span style="color: #15324a; font: 24px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">問句改成「我今天站起來頭有點暈。」，按「問這一句」（現在是陪伴型）。</span>
    </li>
<li style="display: flex; gap: 18px; align-items: center;">
      <div style="flex-shrink: 0; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: #d9edf7; color: #287653; font: 800 20px/1 Consolas,'Noto Sans TC',monospace;">2</div>
      <span style="color: #15324a; font: 24px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">載入「照護嚴謹型」，按「套用」，再按一次「問這一句」。</span>
    </li>
<li style="display: flex; gap: 18px; align-items: center;">
      <div style="flex-shrink: 0; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: #d9edf7; color: #287653; font: 800 20px/1 Consolas,'Noto Sans TC',monospace;">3</div>
      <span style="color: #15324a; font: 24px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">比兩個回答：誰先問感覺、誰追問什麼時候開始、誰請她找護理員。</span>
    </li>
<li style="display: flex; gap: 18px; align-items: center;">
      <div style="flex-shrink: 0; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: #d9edf7; color: #287653; font: 800 20px/1 Consolas,'Noto Sans TC',monospace;">4</div>
      <span style="color: #15324a; font: 24px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">換回「陪伴型」，按「套用」。</span>
    </li></ol>
<div style="flex: 0 0 500px; display: flex; flex-direction: column; gap: 16px;"><div style="display: flex; flex-direction: column; gap: 12px; padding: 30px 30px 32px; border-top: 4px solid #287653; border-radius: 0 0 4px 4px; background: #d9edf7;">
    <span style="color: #287653; font: 800 17px/1 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; letter-spacing: .16em;">要看的地方</span>
    <h3 style="margin: 0; color: #15324a; font: 700 32px/1.3 'Noto Serif TC',Georgia,serif; letter-spacing: -.01em; text-wrap: pretty;">同一份資料，兩種照顧方式</h3>
    <p style="margin: 0; color: #4d6475; font: 23px/1.72 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">頭暈本來就在 B 層。規範一換，豆豆從陪她聊，變成確認症狀、把事情交給真人。</p>
    
  </div></div></div>
