<helmet>

  <style>
    body { margin: 0; background: #f7f2e8; }
    a { color: #287653; } a:hover { color: #15324a; }
  </style>
</helmet>
<div style="position: relative; width: 1600px; height: 900px; overflow: hidden; background: #fffdf8; font-family: 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; color: #15324a;">

    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 32px; padding-bottom: 18px; border-bottom: 1px solid #cfd9dc;">
      <span style="color: #287653; font: 800 16px/1 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; letter-spacing: .18em;">WORKSHOP 02 · 會記得、會主動，也知道何時閉嘴</span>
      <span style="color: #4d6475; font: 700 15px/1 Consolas,'Noto Sans TC',monospace; letter-spacing: .14em;">07 / 22</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 13px;">
      <h1 style="margin: 0; max-width: 1310px; color: #15324a; font: 700 52px/1.16 'Noto Serif TC',Georgia,serif; letter-spacing: -.025em; text-wrap: pretty;">實作一：建檔</h1>
      <p style="margin: 0; max-width: 1200px; color: #4d6475; font: 23px/1.62 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">填表時你是護理員。每填完一區，按該區右上角的「問豆豆這一區」。</p>
    </div>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 22px; min-height: 0;">
      <div style="display: grid; grid-template-columns: 240px 1fr; column-gap: 28px; align-items: start;">
    <div style="padding: 0 0 10px; color: #287653; font: 800 15px/1 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; letter-spacing: .14em; text-align: left;">區</div>
    <div style="padding: 0 0 10px; color: #287653; font: 800 15px/1 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; letter-spacing: .14em; text-align: left;">判斷重點</div>
    <div style="padding: 13px 0; border-top: 1px solid #cfd9dc; color: #15324a; font: 700 21px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-align: left; text-wrap: pretty;">1 基本資料</div>
    <div style="padding: 13px 0; border-top: 1px solid #cfd9dc; color: #4d6475; font: 400 21px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-align: left; text-wrap: pretty;">她希望被怎麼稱呼（§5）</div>
    <div style="padding: 13px 0; border-top: 1px solid #cfd9dc; color: #15324a; font: 700 21px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-align: left; text-wrap: pretty;">2 作息</div>
    <div style="padding: 13px 0; border-top: 1px solid #cfd9dc; color: #4d6475; font: 400 21px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-align: left; text-wrap: pretty;">起床 05:00、就寢 21:30；六段作息勾「不打擾」（§1）</div>
    <div style="padding: 13px 0; border-top: 1px solid #cfd9dc; color: #15324a; font: 700 21px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-align: left; text-wrap: pretty;">3 用藥與回診</div>
    <div style="padding: 13px 0; border-top: 1px solid #cfd9dc; color: #4d6475; font: 400 21px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-align: left; text-wrap: pretty;">藥 07:00、21:00 安眠藥；回診時間（§1、§2）</div>
    <div style="padding: 13px 0; border-top: 1px solid #cfd9dc; color: #15324a; font: 700 21px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-align: left; text-wrap: pretty;">4 興趣與偏好</div>
    <div style="padding: 13px 0; border-top: 1px solid #cfd9dc; color: #4d6475; font: 400 21px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-align: left; text-wrap: pretty;">醫囑「少甜少油」放在這一區（§1）</div>
    <div style="padding: 13px 0; border-top: 1px solid #cfd9dc; color: #15324a; font: 700 21px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-align: left; text-wrap: pretty;">5 近期狀況</div>
    <div style="padding: 13px 0; border-top: 1px solid #cfd9dc; color: #4d6475; font: 400 21px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-align: left; text-wrap: pretty;">哪些是需要追問的「症狀」（§1、§2）</div>
    <div style="padding: 13px 0; border-top: 1px solid #cfd9dc; color: #15324a; font: 700 21px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-align: left; text-wrap: pretty;">6 禁區與不記</div>
    <div style="padding: 13px 0; border-top: 1px solid #cfd9dc; color: #4d6475; font: 400 21px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-align: left; text-wrap: pretty;">哪些話題不主動提起，哪些內容不記（§2、§4、§5）</div>
  </div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding-top: 16px; border-top: 1px solid #cfd9dc;">
      <span style="flex-shrink: 0; width: 9px; height: 9px; border-radius: 50%; background: #f1b879;"></span>
      <span style="color: #4d6475; font: 19px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">§1 裡「不要跟護理師講」那一句，最後一段會再談。</span>
    </div>
  </div>
</div>
