<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=Noto+Serif+TC:wght@500;700;900&amp;display=swap">
  <style>
    body { margin: 0; background: #f7f2e8; }
    a { color: #287653; } a:hover { color: #15324a; }
  </style>
</helmet>
<div style="position: relative; width: 1600px; height: 900px; overflow: hidden; background: #fffdf8; font-family: 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; color: #15324a;">
  <div style="position: absolute; left: 0; top: 0; width: 12px; height: 900px; background: #287653;"></div>
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 30px; padding: 58px 88px 52px 108px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 32px; padding-bottom: 18px; border-bottom: 1px solid #cfd9dc;">
      <span style="color: #287653; font: 800 16px/1 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; letter-spacing: .18em;">WORKSHOP 02 · 會記得、會主動，也知道何時閉嘴</span>
      <span style="color: #4d6475; font: 700 15px/1 Consolas,'Noto Sans TC',monospace; letter-spacing: .14em;">04 / 17</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 13px;">
      <h1 style="margin: 0; max-width: 1310px; color: #15324a; font: 700 52px/1.16 'Noto Serif TC',Georgia,serif; letter-spacing: -.025em; text-wrap: pretty;">記憶怎麼進 Prompt，主動怎麼決定要不要開口</h1>
      
    </div>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 22px; min-height: 0;">
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 14px;">
  <svg viewBox="0 0 1400 500" role="img" aria-label="系統流程圖：記憶要經過分層、擋掉絕不能記的一類與筆數上限才進 Prompt；主動訊息由程式決定說不說" style="display: block; width: 100%; height: auto; font-family: 'Noto Sans TC','Microsoft JhengHei UI',sans-serif;">
    <defs>
      <marker id="w2flow-ink" viewBox="0 0 12 12" refX="10.6" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <path d="M 1.6 1.4 L 11 6 L 1.6 10.6 Z" fill="#3f5a70"></path>
      </marker>
      <marker id="w2flow-apricot" viewBox="0 0 12 12" refX="10.6" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <path d="M 1.6 1.4 L 11 6 L 1.6 10.6 Z" fill="#c07f2c"></path>
      </marker>
      <marker id="w2flow-danger" viewBox="0 0 12 12" refX="10.6" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <path d="M 1.6 1.4 L 11 6 L 1.6 10.6 Z" fill="#a84a42"></path>
      </marker>
      <marker id="w2flow-green" viewBox="0 0 12 12" refX="10.6" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <path d="M 1.6 1.4 L 11 6 L 1.6 10.6 Z" fill="#287653"></path>
      </marker>
    </defs>
    <text x="0" y="30" text-anchor="start" fill="#4d6475" font-size="14" font-weight="800">記憶怎麼進 PROMPT</text>
    <g>
    <rect x="8" y="48" width="286" height="104" rx="8" fill="#fffdf8" stroke="#cfd9dc" stroke-width="1"></rect>
    <circle cx="36" cy="78" r="15" fill="#397d9f"></circle>
    <text x="36" y="84" text-anchor="middle" fill="#fffdf8" font-size="15" font-weight="800">1</text>
    
    <text x="62" y="85" fill="#15324a" font-size="19" font-weight="700">使用者說一句話</text>
    <text x="30" y="120" fill="#4d6475" font-size="15.5">「我對花生過敏」</text>
  </g>
    <g>
    <rect x="374" y="48" width="286" height="104" rx="8" fill="#fffdf8" stroke="#cfd9dc" stroke-width="1"></rect>
    <circle cx="402" cy="78" r="15" fill="#397d9f"></circle>
    <text x="402" y="84" text-anchor="middle" fill="#fffdf8" font-size="15" font-weight="800">2</text>
    
    <text x="428" y="85" fill="#15324a" font-size="17" font-weight="700">豆豆把它寫進記憶</text>
    <text x="396" y="120" fill="#4d6475" font-size="15.5">要指定放哪一層</text>
  </g>
    <g>
    <rect x="740" y="48" width="286" height="104" rx="8" fill="#fffdf8" stroke="#cfd9dc" stroke-width="1"></rect>
    <circle cx="768" cy="78" r="15" fill="#287653"></circle>
    <text x="768" y="84" text-anchor="middle" fill="#fffdf8" font-size="15" font-weight="800">3</text>
    
    <text x="794" y="85" fill="#15324a" font-size="18" font-weight="700">照層別分流</text>
    <text x="762" y="120" fill="#4d6475" font-size="15.5">A 重要事實 B 近期 C 摘要</text>
  </g>
    <g>
    <rect x="1106" y="48" width="286" height="104" rx="8" fill="#fffdf8" stroke="#cfd9dc" stroke-width="1"></rect>
    <circle cx="1134" cy="78" r="15" fill="#f1b879"></circle>
    <text x="1134" y="84" text-anchor="middle" fill="#fffdf8" font-size="15" font-weight="800">4</text>
    
    <text x="1160" y="85" fill="#15324a" font-size="19" font-weight="700">組成 Prompt 段落</text>
    <text x="1128" y="120" fill="#4d6475" font-size="15.5">每層最多 16 筆</text>
  </g>
    <g>
    <rect x="740" y="192" width="286" height="76" rx="8" fill="#fffdf8" stroke="#cfd9dc" stroke-width="1"></rect>
    
    
    <text x="762" y="228" fill="#15324a" font-size="19" font-weight="700">這一類直接拒絕</text>
    <text x="762" y="256" fill="#4d6475" font-size="15.5">密碼 · 金鑰 · 驗證碼</text>
  </g>
    <path d="M 302 100 L 366 100" fill="none" stroke="#3f5a70" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w2flow-ink)"></path>
    <path d="M 668 100 L 732 100" fill="none" stroke="#3f5a70" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w2flow-ink)"></path>
    <path d="M 1034 100 L 1098 100" fill="none" stroke="#3f5a70" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w2flow-ink)"></path>
    <path d="M 883 152 L 883 184" fill="none" stroke="#a84a42" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w2flow-danger)"></path>
    <text x="901" y="174" text-anchor="start" fill="#a84a42" font-size="14" font-weight="600">碰到就擋</text>
    <text x="0" y="306" text-anchor="start" fill="#4d6475" font-size="14" font-weight="800">主動要不要開口</text>
    <g>
    <rect x="8" y="324" width="286" height="104" rx="8" fill="#fffdf8" stroke="#cfd9dc" stroke-width="1"></rect>
    <circle cx="36" cy="354" r="15" fill="#397d9f"></circle>
    <text x="36" y="360" text-anchor="middle" fill="#fffdf8" font-size="15" font-weight="800">1</text>
    
    <text x="62" y="361" fill="#15324a" font-size="19" font-weight="700">事件與你的規則</text>
    <text x="30" y="396" fill="#4d6475" font-size="15.5">安靜 · 不打擾 · 間隔 · 上限</text>
  </g>
    <g>
    <rect x="374" y="324" width="286" height="104" rx="8" fill="#fffdf8" stroke="#cfd9dc" stroke-width="1"></rect>
    <circle cx="402" cy="354" r="15" fill="#397d9f"></circle>
    <text x="402" y="360" text-anchor="middle" fill="#fffdf8" font-size="15" font-weight="800">2</text>
    
    <text x="428" y="361" fill="#15324a" font-size="19" font-weight="700">送去跑規則</text>
    <text x="396" y="396" fill="#4d6475" font-size="15.5">在這台電腦上判斷</text>
  </g>
    <g>
    <rect x="740" y="324" width="286" height="104" rx="8" fill="#fffdf8" stroke="#cfd9dc" stroke-width="1"></rect>
    <circle cx="768" cy="354" r="15" fill="#287653"></circle>
    <text x="768" y="360" text-anchor="middle" fill="#fffdf8" font-size="15" font-weight="800">3</text>
    
    <text x="794" y="361" fill="#15324a" font-size="18" font-weight="700">七條規則依序判斷</text>
    <text x="762" y="396" fill="#4d6475" font-size="15.5">重要提醒直放，其餘依序過關</text>
  </g>
    <g>
    <rect x="1106" y="262" width="286" height="94" rx="8" fill="#fffdf8" stroke="#cfd9dc" stroke-width="1"></rect>
    
    <text x="1128" y="288" fill="#4d6475" font-size="13" font-weight="800" letter-spacing="1.6">不說</text>
    <text x="1128" y="314" fill="#15324a" font-size="19" font-weight="700">留一行 TOOL 說明</text>
    <text x="1128" y="342" fill="#4d6475" font-size="15.5">被哪一條規則擋下</text>
  </g>
    <g>
    <rect x="1106" y="396" width="286" height="94" rx="8" fill="#f7f2e8" stroke="#cfd9dc" stroke-width="1"></rect>
    
    <text x="1128" y="422" fill="#f1b879" font-size="13" font-weight="800" letter-spacing="1.6">說</text>
    <text x="1128" y="448" fill="#15324a" font-size="19" font-weight="700">在對話裡先開口</text>
    <text x="1128" y="476" fill="#4d6475" font-size="15.5">模型只管怎麼講</text>
  </g>
    <path d="M 302 376 L 366 376" fill="none" stroke="#3f5a70" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w2flow-ink)"></path>
    <path d="M 668 376 L 732 376" fill="none" stroke="#3f5a70" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w2flow-ink)"></path>
    <path d="M 1034 376 L 1066 376" fill="none" stroke="#3f5a70" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="M 1066 376 L 1066 323 Q 1066 309 1080 309 L 1098 309" fill="none" stroke="#3f5a70" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w2flow-ink)"></path>
    <path d="M 1066 376 L 1066 429 Q 1066 443 1080 443 L 1098 443" fill="none" stroke="#c07f2c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w2flow-apricot)"></path>
  </svg>
  <figcaption style="color: #4d6475; font: 19px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">兩條路都由程式把關：記憶先分層、擋掉絕不能記的那一類，再取每層最多 16 筆才進 Prompt；要不要開口也是程式決定，模型只負責怎麼講。</figcaption>
</figure>
    </div>
    
  </div>
</div>
</x-dc>
</body>
</html>
