<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=Noto+Serif+TC:wght@500;700;900&amp;display=swap">
  <style>
    body { margin: 0; background: #f7f2e8; }
    a { color: #397d9f; } a:hover { color: #15324a; }
  </style>
</helmet>
<div style="position: relative; width: 1600px; height: 900px; overflow: hidden; background: #fffdf8; font-family: 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; color: #15324a;">
  <div style="position: absolute; left: 0; top: 0; width: 12px; height: 900px; background: #397d9f;"></div>
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 30px; padding: 58px 88px 52px 108px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 32px; padding-bottom: 18px; border-bottom: 1px solid #cfd9dc;">
      <span style="color: #397d9f; font: 800 18px/1 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; letter-spacing: .18em;">WORKSHOP 01 · 讓 DODO 聽完，再回答</span>
      <span style="color: #4d6475; font: 700 17px/1 Consolas,'Noto Sans TC',monospace; letter-spacing: .14em;">19 / 20</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 13px;">
      <h1 style="margin: 0; max-width: 1310px; color: #15324a; font: 700 54px/1.16 'Noto Serif TC',Georgia,serif; letter-spacing: -.025em; text-wrap: pretty;">Prompt 的限制</h1>
      <p style="margin: 0; max-width: 1200px; color: #4d6475; font: 25px/1.62 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">示範：同一份 Prompt、同一句話。</p>
    </div>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 22px; min-height: 0;">
      <div style="display: flex; flex-direction: column; gap: 26px;"><div style="display: flex; gap: 32px; align-items: stretch;"><ol style="display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none;"><li style="display: flex; gap: 18px; align-items: center;">
      <div style="flex-shrink: 0; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: #d9edf7; color: #397d9f; font: 800 20px/1 Consolas,'Noto Sans TC',monospace;">1</div>
      <span style="color: #15324a; font: 24px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">在「對話方式」最後加一句「一次最多兩個短句」，按「套用」。</span>
    </li>
<li style="display: flex; gap: 18px; align-items: center;">
      <div style="flex-shrink: 0; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: #d9edf7; color: #397d9f; font: 800 20px/1 Consolas,'Noto Sans TC',monospace;">2</div>
      <span style="color: #15324a; font: 24px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">同一句話連問五次：「今天天氣好冷，你覺得我要穿什麼？」</span>
    </li>
<li style="display: flex; gap: 18px; align-items: center;">
      <div style="flex-shrink: 0; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: #d9edf7; color: #397d9f; font: 800 20px/1 Consolas,'Noto Sans TC',monospace;">3</div>
      <span style="color: #15324a; font: 24px/1.55 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">數五次裡有幾次只講兩句。</span>
    </li></ol>
<div style="flex: 0 0 500px;"><div style="display: flex; flex-direction: column; gap: 12px; padding: 30px 30px 32px; border-top: 4px solid #287653; border-radius: 0 0 4px 4px; background: #d9edf7;">
    <span style="color: #287653; font: 800 17px/1 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; letter-spacing: .16em;">對照</span>
    <h3 style="margin: 0; color: #15324a; font: 700 32px/1.3 'Noto Serif TC',Georgia,serif; letter-spacing: -.01em; text-wrap: pretty;">插話中斷</h3>
    <p style="margin: 0; color: #4d6475; font: 23px/1.72 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">由回合偵測執行，不需要模型配合。長度規則寫在 Prompt 裡，模型不一定每次照做。</p>
    
  </div></div></div>
<div style="display: flex; align-items: center; gap: 20px; padding: 26px 32px; border-radius: 4px 18px 18px 4px; background: #15324a;">
    <div style="flex-shrink: 0; width: 6px; align-self: stretch; border-radius: 3px; background: #f1b879;"></div>
    <p style="margin: 0; color: #fffdf8; font: 700 30px/1.5 'Noto Sans TC','Microsoft JhengHei UI',sans-serif; text-wrap: pretty;">需要確定發生的行為寫在程式裡。第二堂的主動規則就是這樣設計。</p>
  </div></div>
    </div>
    
  </div>
</div>
</x-dc>
</body>
</html>
