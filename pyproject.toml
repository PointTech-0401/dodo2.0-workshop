[project]
name = "dodo2-workshop"
version = "0.1.0"
description = "Two-stage dodo 2.0 workshop with a shared text and optional voice client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openai>=2.13.0",
  "python-dotenv>=1.0.0",
  "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
